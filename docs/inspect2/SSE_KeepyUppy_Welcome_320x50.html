    .outlined-text {
      overflow: visible;
    }
    /* Tight content-height SVGs: keep width for authored text-align, let host
       flex (CTA / headlines / offers) vertically align — height:100% was
       stretching the viewBox and pinning glyph ink to the top of the box. */
    .outlined-text svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    p, h1, h2, h3 {
      margin: 0px;
    }
    body {
      overflow: hidden;
      background: #fff;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 320px;
      height: 50px;
      transform-style: preserve-3d;
      background: transparent;
    }
    /* Hold the motion clock at t=0 until fonts + offer layout settle so cold
       first paint matches warm Replay (see startMotionWhenReady). */
    .stage:not(.motion-ready),
    .stage:not(.motion-ready) * {
      animation-play-state: paused !important;
    }
    .stage-element,
    .stage-static {
      position: absolute;
      visibility: inherit;
      box-sizing: border-box;
    }

    /* ── Shared typography ── */
    .sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    .sse-text-heavy {
      font-weight: 900;
    }

    .sse-text-bold {
      font-weight: 700;
    }

    /* ── OfferSlot group plumbing ── */
    [data-gwd-group="OfferSlot"] {
      width: 100%;
      height: 100%;
    }

    [data-gwd-group="OfferSlot"] .gwd-grp-offer {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      font-weight: 700;
      color: rgb(0, 41, 117);
      visibility: inherit;
    }

    [data-gwd-group="OfferSlot"] .offer-value .sym-pct {
      font-size: 0.6em;
      vertical-align: baseline;
      position: relative;
      /* Vertical offset computed at runtime from glyph metrics
         (alignPercentSymbols) so the % bottom-aligns with the digits. */
    }

    /* ── T&C group plumbing ── */
    [data-gwd-group="tc_prices"] .gwd-grp-tc.sse-text,
    [data-gwd-group="tc_solo"] .gwd-grp-tc.sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    /* Feed text uses \n for forced breaks (e.g. two-line unit rate). */
    .terms-prices,
    .terms-solo,
    .unit-rate-prices {
      white-space: pre-line;
    }

    /* ── T&C wrappers (far-left tiny zone) ── */
