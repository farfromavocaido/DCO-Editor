    .outlined-text {
      overflow: visible;
    }
    /* Tight content-height SVGs: keep width for authored text-align, let host
       flex (CTA / headlines / offers) vertically align — height:100% was
       stretching the viewBox and pinning glyph ink to the top of the box. */
    .outlined-text svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    p, h1, h2, h3 {
      margin: 0px;
    }
    body {
      overflow: hidden;
      background: #fff;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 728px;
      height: 90px;
      transform-style: preserve-3d;
      background: transparent;
    }
    /* Hold the motion clock at t=0 until fonts + offer layout settle so cold
       first paint matches warm Replay (see startMotionWhenReady). */
    .stage:not(.motion-ready),
    .stage:not(.motion-ready) * {
      animation-play-state: paused !important;
    }
    .stage-element,
    .stage-static {
      position: absolute;
      visibility: inherit;
      box-sizing: border-box;
    }

    /* ── Shared typography ── */
    .sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    .sse-text-heavy {
