    .outlined-text {
      overflow: visible;
    }
    /* Intrinsic SVG size = baked CSS line boxes (true font-size + half-leading).
       Do not stretch with width:100% — that scaled paths down inside padded CTA
       content boxes (~15px → ~10.8px when padding:0 18px). Flex hosts still centre. */
    .outlined-text svg {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      overflow: visible;
      pointer-events: none;
      flex: 0 0 auto;
    }
    /* Font-mode CTA padding is for live text wrap inside the box. Outlined SVG
       is already baked to the full authored width — zero padding so glyphs stay
       at designed size. */
    .cta.outlined-text {
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    p, h1, h2, h3 {
      margin: 0px;
    }
    body {
      overflow: hidden;
      background: #fff;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 300px;
      height: 250px;
      transform-style: preserve-3d;
      background: transparent;
    }
    /* Hold the motion clock at t=0 until fonts + offer layout settle so cold
       first paint matches warm Replay (see startMotionWhenReady). */
    .stage:not(.motion-ready),
    .stage:not(.motion-ready) * {
      animation-play-state: paused !important;
    }
    .stage-element,
    .stage-static {
      position: absolute;
      visibility: inherit;
      box-sizing: border-box;
    }

    /* ── Shared typography ── */
    .sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    .sse-text-heavy {
      font-weight: 900;
    }

    .sse-text-bold {

    /* ── T&C group plumbing ── */

    /* ── T&C wrappers ── */
