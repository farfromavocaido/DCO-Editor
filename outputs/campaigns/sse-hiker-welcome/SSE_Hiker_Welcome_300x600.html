    .outlined-text {
      overflow: visible;
    }
    /* Intrinsic SVG size = baked CSS line boxes (true font-size + half-leading).
       Do not stretch with width:100% — that scaled paths down inside padded CTA
       content boxes (~15px → ~10.8px when padding:0 18px). Flex hosts still centre. */
    .outlined-text svg {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      overflow: visible;
      pointer-events: none;
      flex: 0 0 auto;
    }
    /* Font-mode CTA padding is for live text wrap inside the box. Outlined SVG
       is already baked to the full authored width — zero padding so glyphs stay
       at designed size. */
    .cta.outlined-text {
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    p, h1, h2, h3 {
      margin: 0px;
    }
    body {
      overflow: hidden;
      background: #fff;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 300px;
      height: 600px;
      transform-style: preserve-3d;
      background: transparent;
    }
    /* Hold the motion clock at t=0 until fonts + offer layout settle so cold
       first paint matches warm Replay (see startMotionWhenReady). */
    .stage:not(.motion-ready),
    .stage:not(.motion-ready) * {
      animation-play-state: paused !important;
    }
    .stage-element,
    .stage-static {
      position: absolute;
      visibility: inherit;
      box-sizing: border-box;
    }

    /* ── Shared typography ── */
    .sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    .sse-text-heavy {
      font-weight: 900;
    }

    .sse-text-bold {
      font-weight: 700;
    }

    /* ── OfferSlot group plumbing ── */
    [data-gwd-group="OfferSlot"] {
      width: 100%;
      height: 100%;
    }

    [data-gwd-group="OfferSlot"] .gwd-grp-offer {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      font-weight: 700;
      color: rgb(0, 41, 117);
      visibility: inherit;
    }

    [data-gwd-group="OfferSlot"] .offer-value .sym-pct {
      font-size: 0.6em;
      vertical-align: baseline;
      position: relative;
      /* Vertical offset computed at runtime from glyph metrics
         (alignPercentSymbols) so the % bottom-aligns with the digits. */
    }

    /* ── T&C group plumbing ── */
    [data-gwd-group="tc_prices"] .gwd-grp-tc.sse-text,
    [data-gwd-group="tc_solo"] .gwd-grp-tc.sse-text {
      position: absolute;
      font-family: Museo, Arial, sans-serif;
      color: rgb(0, 41, 117);
    }

    /* Feed text uses \n for forced breaks (e.g. two-line unit rate). */
    .unit-rate-prices {
      white-space: pre-line;
    }

    /* CTA copy breaks into two centred lines inside the roundel (ref). */
    .cta {
      padding: 0 26px;
      box-sizing: border-box;
    }

    /* ── T&C wrappers (bottom-left) ── */
    .tc-prices-group,
    .tc-solo-group {

    }
