    .outlined-text {
      overflow: visible;
    }
    /* Intrinsic SVG size = baked CSS line boxes (true font-size + half-leading).
       Do not stretch with width:100% — that scaled paths down inside padded CTA
       content boxes (~15px → ~10.8px when padding:0 18px). Flex hosts still centre. */
    .outlined-text svg {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      overflow: visible;
      pointer-events: none;
      flex: 0 0 auto;
    }
    /* Headline skip/merge motion animates ink on the host. Keep outlined glyphs
       on that same colour channel instead of freezing the snapshot's rest ink. */
    .sse-headline.outlined-text svg g {
      fill: currentColor;
    }
    /* Font-mode CTA padding is for live text wrap inside the box. Outlined SVG
       is already baked to the full authored width — zero padding so glyphs stay
       at designed size. */
    .cta.outlined-text {
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    p, h1, h2, h3 {
      margin: 0px;
    }
    body {
      overflow: hidden;
      background: #fff;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 320px;
      height: 50px;
      transform-style: preserve-3d;
      background: transparent;
    }
    /* Full-bleed hit target for Studio / static exits. Must sit above creative
       layers so preview tools and serve-time clicks always have a triggerable surface. */
    #clickbox {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 2147483647;
      cursor: pointer;
      background: transparent;
      display: block;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hold the motion clock at t=0 until fonts + offer layout settle so cold
       first paint matches warm Replay (see startMotionWhenReady). */
    .stage:not(.motion-ready),
    .stage:not(.motion-ready) * {
      animation-play-state: paused !important;
    }
    .stage-element,
    .stage-static {
      position: absolute;
      visibility: inherit;
      box-sizing: border-box;
    }

          window.requestAnimationFrame(function() {
